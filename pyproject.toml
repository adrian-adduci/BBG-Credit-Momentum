[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbg-credit-momentum"
version = "0.2.0"
description = "ML decision support for Bloomberg credit analytics, with leakage-safe forecasting and walk-forward backtesting"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Adrian Adduci", email = "FAA2160@columbia.edu" }]
requires-python = ">=3.11,<3.13"
keywords = ["finance", "credit", "bloomberg", "machine-learning", "forecasting"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime pins live in requirements.txt rather than here.
#
# ppscore==1.3.0 declares pandas<2 while the project needs pandas==2.2.3, so a
# PEP 621 dependency list would be unsatisfiable and `pip install .` would fail
# outright. The split install documented in the README (and executed by
# .github/workflows/ci.yml) is the supported path until ppscore is replaced.
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.3", "httpx==0.27.2"]

[project.urls]
Homepage = "https://github.com/adrian-adduci/BBG-Credit-Momentum"
Repository = "https://github.com/adrian-adduci/BBG-Credit-Momentum"

[project.scripts]
bbg-backtest = "backtest:main"

# The project is a flat collection of top-level modules rather than a package,
# so setuptools is told explicitly what to ship and auto-discovery is disabled.
# Without this it errors on the multiple top-level directories in the repo root.
[tool.setuptools]
py-modules = [
    "backtest",
    "config",
    "crypto_data_sources",
    "data_sources",
    "forecasting",
    "logging_setup",
    "models",
    "preprocessing",
]

[tool.setuptools.packages.find]
include = ["indicators*", "blockchain*", "database*"]

[tool.pytest.ini_options]
# Without a rootdir config, the suite only collected when pytest happened to be
# invoked as `python -m pytest` from the repository root, because that is what
# put the repo on sys.path. pythonpath makes a bare `pytest` work too.
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
filterwarnings = [
    # ppscore 1.3.0 imports pkg_resources, removed in setuptools 81+.
    "ignore:pkg_resources is deprecated as an API:UserWarning",
]
